name: Deploy HTML Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Get Website URL
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          USER="${GITHUB_REPOSITORY_OWNER}"

          if [ "$REPO" = "$USER.github.io" ]; then
            URL="https://$USER.github.io/"
          else
            URL="https://$USER.github.io/$REPO/"
          fi

          echo "=========================================="
          echo "🚀 WEBSITE DEPLOYED SUCCESSFULLY"
          echo "🌐 URL: $URL"
          echo "=========================================="

          echo "## 🚀 Website Deployed Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🌐 Live Website" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[👉 Open Website]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
